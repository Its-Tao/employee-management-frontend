<div class="p-6">

  <!-- Page Header -->
  <div class="flex justify-between items-center mb-6">

    <div>
      <h2 class="text-2xl font-bold text-gray-800">
        Roles
      </h2>

      <p class="text-gray-500 mt-1">
        Manage your system roles
      </p>
    </div>

  </div>


  <!-- Add / Edit Role Form -->
  <div class="bg-white rounded-lg shadow p-6 mb-6">

    <h3 class="text-lg font-semibold text-gray-800 mb-5">
      @if (editingRoleId === null) {
        Add Role
      } @else {
        Edit Role
      }
    </h3>


    <form
      (ngSubmit)="editingRoleId === null
        ? addRole()
        : updateRole()">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

        <!-- Role Name -->
        <div>

          <label class="block text-sm font-medium text-gray-700 mb-2">
            Role Name
          </label>

          <input
            type="text"
            name="name"
            [(ngModel)]="newRole.name"
            placeholder="Enter role name"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5">

        </div>


        <!-- Description -->
        <div>

          <label class="block text-sm font-medium text-gray-700 mb-2">
            Description
          </label>

          <input
            type="text"
            name="description"
            [(ngModel)]="newRole.description"
            placeholder="Enter role description"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5">

        </div>

      </div>


      <!-- Buttons -->
      <div class="flex justify-end gap-3 mt-6">

        @if (editingRoleId !== null) {

          <button
            type="button"
            (click)="resetForm()"
            class="border border-gray-300 text-gray-700 px-5 py-2.5 rounded-lg hover:bg-gray-100 transition">
            Cancel
          </button>

        }


        <button
          type="submit"
          class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 transition">

          @if (editingRoleId === null) {
            Save Role
          } @else {
            Update Role
          }

        </button>

      </div>

    </form>

  </div>


  <!-- Role List -->
  <div class="bg-white rounded-lg shadow overflow-hidden">

    <div class="p-5 border-b">

      <h3 class="text-lg font-semibold text-gray-800">
        Role List
      </h3>

      <p class="text-sm text-gray-500 mt-1">
        Roles registered in the system
      </p>

    </div>


    <div class="overflow-x-auto">

      <table class="w-full">

        <thead class="bg-gray-100">

          <tr>

            <th class="text-left p-4">
              ID
            </th>

            <th class="text-left p-4">
              Name
            </th>

            <th class="text-left p-4">
              Description
            </th>

            <th class="text-left p-4">
              Actions
            </th>

          </tr>

        </thead>


        <tbody>

          @for (role of roles; track role.id) {

            <tr class="border-t hover:bg-gray-50">

              <td class="p-4">
                {{ role.id }}
              </td>

              <td class="p-4">
                {{ role.name }}
              </td>

              <td class="p-4">
                {{ role.description }}
              </td>

              <td class="p-4">

                <button
                  type="button"
                  (click)="editRole(role)"
                  class="text-blue-600 mr-4 hover:text-blue-800">
                  Edit
                </button>

                <button
                  type="button"
                  (click)="deleteRole(role.id)"
                  class="text-red-600 hover:text-red-800">
                  Delete
                </button>

              </td>

            </tr>

          }

        </tbody>

      </table>

    </div>

  </div>

</div>n
