<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">

  <form
    (ngSubmit)="onLogin()"
    class="w-full max-w-md rounded-lg bg-white p-8 shadow-lg"
  >

    <h1 class="mb-2 text-center text-2xl font-bold text-gray-800">
      Employee Management System
    </h1>

    <p class="mb-6 text-center text-gray-500">
      Sign in to your account
    </p>

    <div class="mb-4">
      <label for="username" class="mb-2 block font-medium">
        Username
      </label>

      <input
        id="username"
        name="username"
        type="text"
        [(ngModel)]="credentials.username"
        required
        class="w-full rounded-lg border border-gray-300 p-3 outline-none focus:border-blue-500"
        placeholder="Enter your username"
      />
    </div>

    <div class="mb-4">
      <label for="password" class="mb-2 block font-medium">
        Password
      </label>

      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="credentials.password"
        required
        class="w-full rounded-lg border border-gray-300 p-3 outline-none focus:border-blue-500"
        placeholder="Enter your password"
      />
    </div>

    @if (errorMessage) {
      <p class="mb-4 text-sm text-red-600">
        {{ errorMessage }}
      </p>
    }

    <button
      type="submit"
      [disabled]="isLoading"
      class="w-full rounded-lg bg-blue-600 p-3 font-semibold text-white hover:bg-blue-700 disabled:opacity-50"
    >
      {{ isLoading ? 'Signing in...' : 'Login' }}
    </button>

  </form>

</div>
